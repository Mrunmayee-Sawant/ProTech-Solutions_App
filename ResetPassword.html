<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password - ProTech Solutions</title>
    <link rel="stylesheet" href="C-CSS.css">
    <link rel="icon" type="image/svg+xml" href="images/protech-logo.svg">
</head>

<body>

    <div class="login-container">

        <a href="Login.html" style="text-decoration: none;">
            <img src="images/protech-logo.svg" alt="ProTech Solutions Logo" class="login-logo">
        </a>

        <h2>Reset Password</h2>
        <p class="subtitle">Enter your new secure password below</p>

        <form id="resetPasswordForm">

            <div class="form-group">
                <label for="newPassword">New Password</label>
                <input
                    type="password"
                    id="newPassword"
                    placeholder="Enter new password (min. 6 characters)"
                    minlength="6"
                    required
                >
            </div>

            <div class="form-group">
                <label for="confirmNewPassword">Confirm New Password</label>
                <input
                    type="password"
                    id="confirmNewPassword"
                    placeholder="Confirm new password"
                    minlength="6"
                    required
                >
            </div>

            <button type="button" id="resetPasswordButton" class="submit-btn">Reset Password</button>

        </form>

        <p class="back-login">
            <a href="Login.html">Back to Login</a>
        </p>

    </div>

    <script src="C-JS.js"></script>

</body>

</html>
