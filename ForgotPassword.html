<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password - ProTech Solutions</title>
    <link rel="stylesheet" href="C-CSS.css">
    <link rel="icon" type="image/svg+xml" href="images/protech-logo.svg">
</head>

<body>

    <div class="login-container">

        <a href="Login.html" style="text-decoration: none;">
            <img src="images/protech-logo.svg" alt="ProTech Solutions Logo" class="login-logo">
        </a>

        <h2>Forgot Password</h2>
        <p class="subtitle">Enter your registered email address to verify your account</p>

        <form id="forgotPasswordForm">

            <div class="form-group">
                <label for="forgotEmail">Registered Email Address</label>
                <input
                    type="email"
                    id="forgotEmail"
                    name="email"
                    placeholder="Enter your registered email"
                    required
                >
            </div>

            <button type="submit" class="submit-btn">Verify Email &amp; Continue</button>

        </form>

        <p class="back-login">
            Remember your password?
            <a href="Login.html">Back to Login</a>
        </p>

    </div>

    <script src="C-JS.js"></script>

</body>

</html>
