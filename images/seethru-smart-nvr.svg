<!-- Godrej SeeThru Smart 32-Channel 4K NVR -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 240" width="320" height="240">
  <rect width="100%" height="100%" fill="#F8FAFC" rx="12"/>
  <!-- NVR Rackmount / Desktop Chassis -->
  <rect x="30" y="70" width="260" height="85" rx="6" fill="#1E293B" stroke="#475569" stroke-width="2"/>
  <rect x="35" y="75" width="250" height="75" rx="4" fill="#0F172A"/>
  <!-- Front Bezel Metallic Line -->
  <line x1="35" y1="112" x2="285" y2="112" stroke="#334155" stroke-width="1.5"/>
  <!-- Godrej / ProTech Branding -->
  <text x="50" y="98" fill="#F8FAFC" font-size="11" font-family="sans-serif" font-weight="bold">4K ULTRA HD NVR</text>
  <text x="50" y="132" fill="#64748B" font-size="9" font-family="sans-serif">32-CH H.265+ NETWORK RECORDER</text>
  <!-- Power & Status LEDs -->
  <circle cx="215" cy="95" r="3" fill="#22C55E"/>
  <text x="212" y="105" fill="#64748B" font-size="6" font-family="sans-serif">PWR</text>
  <circle cx="230" cy="95" r="3" fill="#EF4444"/>
  <text x="227" y="105" fill="#64748B" font-size="6" font-family="sans-serif">REC</text>
  <circle cx="245" cy="95" r="3" fill="#38BDF8"/>
  <text x="242" y="105" fill="#64748B" font-size="6" font-family="sans-serif">NET</text>
  <!-- Front USB Port -->
  <rect x="262" y="90" width="10" height="8" rx="1" fill="#475569" stroke="#94A3B8"/>
  <!-- Cooling Vents -->
  <line x1="210" y1="130" x2="275" y2="130" stroke="#334155" stroke-width="2" stroke-dasharray="4,3"/>
  <text x="160" y="200" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="700" fill="#334155">SeeThru Smart 32-CH 4K NVR</text>
</svg>
