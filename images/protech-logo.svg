<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 120" width="520" height="120">
  <defs>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2D5A5C" />
      <stop offset="50%" stop-color="#5F9EA0" />
      <stop offset="100%" stop-color="#3D7274" />
    </linearGradient>
    <linearGradient id="lensGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1A2D30" />
      <stop offset="50%" stop-color="#2F4F4F" />
      <stop offset="100%" stop-color="#0F1B1D" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4FD1C5" />
      <stop offset="100%" stop-color="#319795" />
    </linearGradient>
    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Logo Mark -->
  <g transform="translate(10, 10)">
    <!-- Security Shield Base -->
    <path d="M 50 5 L 88 20 C 88 65 50 88 50 95 C 50 88 12 65 12 20 Z" fill="url(#shieldGrad)" />
    <!-- Shield Border Accent -->
    <path d="M 50 10 L 82 23 C 82 60 50 82 50 88 C 50 82 18 60 18 23 Z" fill="#FFFFFF" opacity="0.15" />
    
    <!-- Camera Body / Lens Housing -->
    <circle cx="50" cy="45" r="24" fill="url(#lensGrad)" stroke="#FFFFFF" stroke-width="2.5" />
    <circle cx="50" cy="45" r="17" fill="#0D191B" stroke="#4FD1C5" stroke-width="1.5" />
    <circle cx="50" cy="45" r="10" fill="#203C3E" />
    <circle cx="50" cy="45" r="5" fill="#4FD1C5" />
    <circle cx="47" cy="42" r="2" fill="#FFFFFF" opacity="0.9" />

    <!-- Surveillance Rec Signal / IR LED -->
    <circle cx="68" cy="28" r="3.5" fill="#E53E3E" filter="url(#subtleGlow)" />
    <circle cx="68" cy="28" r="1.5" fill="#FEB2B2" />

    <!-- Cyber Shield Lines -->
    <path d="M 32 45 L 20 45" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" opacity="0.8" />
    <path d="M 68 45 L 80 45" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" opacity="0.8" />
    <path d="M 50 69 L 50 80" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" opacity="0.8" />
  </g>

  <!-- Typography: ProTech Solutions -->
  <g transform="translate(120, 24)">
    <!-- Company Name -->
    <text x="0" y="38" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="34" font-weight="800" fill="#1A3638" letter-spacing="-0.5">
      Pro<tspan fill="#5F9EA0">Tech</tspan> <tspan font-weight="600" fill="#2D3748">Solutions</tspan>
    </text>
    
    <!-- Tagline -->
    <text x="2" y="60" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#4A5568" letter-spacing="2.5">
      CCTV SURVEILLANCE &amp; SECURITY SYSTEMS
    </text>

    <!-- Tech Accent Bar -->
    <rect x="2" y="68" width="180" height="3" rx="1.5" fill="url(#accentGrad)" />
    <circle cx="190" cy="69.5" r="2" fill="#5F9EA0" />
    <circle cx="198" cy="69.5" r="1.5" fill="#A0AEC0" />
  </g>
</svg>
