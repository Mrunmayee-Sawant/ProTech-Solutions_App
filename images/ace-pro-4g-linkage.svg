<!-- Godrej Ace Pro 4G Linkage Camera (Dual Lens Fixed + PTZ) -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 240" width="320" height="240">
  <rect width="100%" height="100%" fill="#F8FAFC" rx="12"/>
  <!-- Top Fixed Wide Angle Camera Unit -->
  <rect x="120" y="30" width="80" height="40" rx="8" fill="#1E293B" stroke="#64748B" stroke-width="2"/>
  <circle cx="160" cy="50" r="12" fill="#0F172A" stroke="#5F9EA0" stroke-width="1.5"/>
  <circle cx="160" cy="50" r="6" fill="#38BDF8"/>
  <circle cx="135" cy="50" r="2.5" fill="#EF4444"/>
  <!-- Lower PTZ Dome Unit -->
  <path d="M 152 70 L 168 70 L 168 85 L 152 85 Z" fill="#64748B"/>
  <circle cx="160" cy="125" r="40" fill="#FFFFFF" stroke="#64748B" stroke-width="2"/>
  <circle cx="160" cy="125" r="28" fill="#0F172A"/>
  <circle cx="160" cy="125" r="15" fill="#1E293B" stroke="#10B981" stroke-width="2"/>
  <circle cx="160" cy="125" r="7" fill="#0284C7"/>
  <!-- Dual 4G Antennas -->
  <line x1="120" y1="40" x2="85" y2="20" stroke="#334155" stroke-width="3" stroke-linecap="round"/>
  <line x1="200" y1="40" x2="235" y2="20" stroke="#334155" stroke-width="3" stroke-linecap="round"/>
  <text x="160" y="215" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="700" fill="#334155">Ace Pro 4G Linkage Dual-Lens</text>
</svg>
