<!-- Godrej Ace Pro Green Solar 4G CCTV -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 240" width="320" height="240">
  <rect width="100%" height="100%" fill="#F8FAFC" rx="12"/>
  <!-- Solar Panel Top -->
  <polygon points="70,45 250,45 235,15 85,15" fill="#1E293B" stroke="#047857" stroke-width="2"/>
  <!-- Solar Grid lines -->
  <line x1="120" y1="18" x2="115" y2="43" stroke="#10B981" stroke-width="1.5" opacity="0.6"/>
  <line x1="160" y1="18" x2="160" y2="43" stroke="#10B981" stroke-width="1.5" opacity="0.6"/>
  <line x1="200" y1="18" x2="205" y2="43" stroke="#10B981" stroke-width="1.5" opacity="0.6"/>
  <line x1="80" y1="30" x2="240" y2="30" stroke="#10B981" stroke-width="1.5" opacity="0.6"/>
  
  <!-- Mount Bracket -->
  <rect x="154" y="45" width="12" height="30" fill="#64748B"/>
  
  <!-- Camera Sphere / Body -->
  <circle cx="160" cy="115" r="45" fill="#FFFFFF" stroke="#047857" stroke-width="3"/>
  <circle cx="160" cy="115" r="32" fill="#0F172A"/>
  
  <!-- 4MP Lens -->
  <circle cx="160" cy="115" r="18" fill="#1E293B" stroke="#10B981" stroke-width="2"/>
  <circle cx="160" cy="115" r="9" fill="#0284C7"/>
  <circle cx="157" cy="112" r="3" fill="#FFFFFF" opacity="0.9"/>
  
  <!-- Dual Antennas for 4G -->
  <line x1="120" y1="95" x2="95" y2="55" stroke="#334155" stroke-width="4" stroke-linecap="round"/>
  <line x1="200" y1="95" x2="225" y2="55" stroke="#334155" stroke-width="4" stroke-linecap="round"/>
  
  <!-- IR & Floodlight LEDs -->
  <circle cx="140" cy="115" r="3" fill="#EF4444"/>
  <circle cx="180" cy="115" r="3" fill="#EF4444"/>
  <circle cx="160" cy="90" r="3" fill="#FBBF24"/>
  
  <!-- PIR Sensor -->
  <rect x="152" y="140" width="16" height="8" rx="4" fill="#CBD5E1"/>

  <text x="160" y="215" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="700" fill="#334155">Ace Pro Green (Solar 4G 4MP)</text>
</svg>
