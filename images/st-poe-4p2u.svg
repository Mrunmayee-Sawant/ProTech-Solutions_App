<!-- Godrej SeeThru ST-POE-4P2U PoE Switch -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 240" width="320" height="240">
  <rect width="100%" height="100%" fill="#F8FAFC" rx="12"/>
  <!-- Metal Switch Case -->
  <rect x="40" y="65" width="240" height="95" rx="6" fill="#1E293B" stroke="#475569" stroke-width="2"/>
  <rect x="45" y="70" width="230" height="85" rx="4" fill="#0F172A"/>
  <!-- Logo & Title -->
  <text x="58" y="90" fill="#38BDF8" font-size="10" font-family="sans-serif" font-weight="bold">PoE SWITCH (4P + 2 Uplink)</text>
  <!-- 4 PoE Ports (Yellow/Orange outline) -->
  <g transform="translate(58, 105)">
    <rect x="0" y="0" width="18" height="20" rx="3" fill="#334155" stroke="#F59E0B" stroke-width="1.5"/>
    <circle cx="9" cy="5" r="2" fill="#22C55E"/>
    <rect x="24" y="0" width="18" height="20" rx="3" fill="#334155" stroke="#F59E0B" stroke-width="1.5"/>
    <circle cx="33" cy="5" r="2" fill="#22C55E"/>
    <rect x="48" y="0" width="18" height="20" rx="3" fill="#334155" stroke="#F59E0B" stroke-width="1.5"/>
    <circle cx="57" cy="5" r="2" fill="#22C55E"/>
    <rect x="72" y="0" width="18" height="20" rx="3" fill="#334155" stroke="#F59E0B" stroke-width="1.5"/>
    <circle cx="81" cy="5" r="2" fill="#22C55E"/>
    <text x="45" y="32" fill="#F59E0B" font-size="8" font-family="sans-serif" text-anchor="middle">PoE Ports (1-4)</text>
  </g>
  <!-- 2 Uplink Ports (Blue outline) -->
  <g transform="translate(180, 105)">
    <rect x="0" y="0" width="18" height="20" rx="3" fill="#334155" stroke="#38BDF8" stroke-width="1.5"/>
    <circle cx="9" cy="5" r="2" fill="#38BDF8"/>
    <rect x="24" y="0" width="18" height="20" rx="3" fill="#334155" stroke="#38BDF8" stroke-width="1.5"/>
    <circle cx="33" cy="5" r="2" fill="#38BDF8"/>
    <text x="21" y="32" fill="#38BDF8" font-size="8" font-family="sans-serif" text-anchor="middle">Uplink (5-6)</text>
  </g>
  <!-- Power LED -->
  <circle cx="245" cy="88" r="3" fill="#22C55E"/>
  <text x="252" y="91" fill="#64748B" font-size="7" font-family="sans-serif">PWR</text>
  <text x="160" y="200" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="700" fill="#334155">SeeThru ST-POE-4P2U (65W PoE)</text>
</svg>
