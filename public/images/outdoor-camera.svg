<!-- Outdoor Bullet CCTV Camera -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 240" width="320" height="240">
  <rect width="100%" height="100%" fill="#F8FAFC" rx="12"/>
  <!-- Wall Mount -->
  <polygon points="40,110 70,80 70,160 40,140" fill="#475569"/>
  <!-- Swivel Arm -->
  <rect x="70" y="112" width="40" height="16" rx="4" fill="#64748B"/>
  <circle cx="105" cy="120" r="10" fill="#334155"/>
  <!-- Sun Shield Hood -->
  <path d="M 95 72 L 235 60 L 235 78 L 95 85 Z" fill="#334155"/>
  <!-- Cylindrical Bullet Camera Body -->
  <rect x="105" y="80" width="120" height="75" rx="10" fill="#E2E8F0" stroke="#94A3B8" stroke-width="2"/>
  <!-- Front Lens Ring -->
  <rect x="220" y="82" width="22" height="71" rx="4" fill="#1E293B"/>
  <ellipse cx="238" cy="117.5" rx="8" ry="32" fill="#0F172A"/>
  <!-- Central Glass Lens -->
  <circle cx="236" cy="117.5" r="14" fill="#0284C7" stroke="#38BDF8" stroke-width="2"/>
  <circle cx="236" cy="117.5" r="7" fill="#0369A1"/>
  <circle cx="233" cy="114" r="2.5" fill="#FFFFFF"/>
  <!-- Infrared Array -->
  <circle cx="236" cy="95" r="2.5" fill="#EF4444"/>
  <circle cx="236" cy="140" r="2.5" fill="#EF4444"/>
  <text x="160" y="210" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="700" fill="#334155">Outdoor HD Bullet Security Camera</text>
</svg>
