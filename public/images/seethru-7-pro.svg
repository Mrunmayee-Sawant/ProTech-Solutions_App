<!-- Godrej SeeThru 7 Pro Video Door Phone -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 240" width="320" height="240">
  <rect width="100%" height="100%" fill="#F8FAFC" rx="12"/>
  <!-- Indoor Touch Monitor -->
  <rect x="30" y="35" width="165" height="155" rx="8" fill="#1E293B" stroke="#CBD5E1" stroke-width="2"/>
  <rect x="40" y="45" width="145" height="105" rx="4" fill="#0F172A"/>
  <!-- Screen Mockup -->
  <rect x="42" y="47" width="141" height="101" rx="2" fill="#0284C7" opacity="0.15"/>
  <circle cx="112" cy="97" r="16" fill="#38BDF8" opacity="0.4"/>
  <text x="50" y="65" fill="#94A3B8" font-size="10" font-family="sans-serif">Live Entrance View</text>
  <circle cx="168" cy="58" r="4" fill="#22C55E"/>
  <!-- Monitor Touch Controls -->
  <circle cx="65" cy="168" r="7" fill="#334155" stroke="#64748B"/>
  <circle cx="112" cy="168" r="9" fill="#0284C7"/>
  <path d="M 108 168 L 116 168" stroke="#FFFFFF" stroke-width="2"/>
  <circle cx="160" cy="168" r="7" fill="#334155" stroke="#64748B"/>
  <!-- Outdoor Bell & Camera Unit -->
  <rect x="220" y="45" width="70" height="145" rx="10" fill="#334155" stroke="#94A3B8" stroke-width="2"/>
  <rect x="226" y="52" width="58" height="50" rx="6" fill="#0F172A"/>
  <circle cx="255" cy="77" r="14" fill="#1E293B" stroke="#5F9EA0" stroke-width="2"/>
  <circle cx="255" cy="77" r="6" fill="#0284C7"/>
  <circle cx="270" cy="62" r="3" fill="#EF4444"/>
  <!-- Call Button with bell icon -->
  <circle cx="255" cy="145" r="15" fill="#5F9EA0"/>
  <path d="M 251 148 L 259 148 L 257 140 A 4 4 0 0 0 249 140 Z" fill="#FFFFFF"/>
  <circle cx="254" cy="151" r="1.5" fill="#FFFFFF"/>
  <!-- Badge -->
  <text x="160" y="218" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="700" fill="#334155">SeeThru 7 Pro (Monitor + Outdoor Cam)</text>
</svg>
