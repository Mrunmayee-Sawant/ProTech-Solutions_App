<!-- Godrej SeeThru 7 Contactless -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 240" width="320" height="240">
  <rect width="100%" height="100%" fill="#F8FAFC" rx="12"/>
  <!-- Monitor Body -->
  <rect x="50" y="30" width="220" height="150" rx="10" fill="#0F172A" stroke="#475569" stroke-width="2"/>
  <!-- 7-Inch Display -->
  <rect x="65" y="42" width="190" height="105" rx="5" fill="#1E293B"/>
  <rect x="67" y="44" width="186" height="101" rx="3" fill="#0EA5E9" opacity="0.12"/>
  <!-- UI on Screen -->
  <circle cx="160" cy="85" r="20" fill="#0284C7" opacity="0.4"/>
  <path d="M 152 85 L 168 85 M 160 77 L 160 93" stroke="#FFFFFF" stroke-width="2.5"/>
  <text x="75" y="62" fill="#38BDF8" font-size="11" font-family="sans-serif" font-weight="bold">Contactless Wave Call</text>
  <!-- Hand Wave Sensor Indicator -->
  <g transform="translate(140, 155)">
    <path d="M 0 10 A 15 15 0 0 1 40 10" fill="none" stroke="#38BDF8" stroke-width="2"/>
    <path d="M 7 10 A 8 8 0 0 1 33 10" fill="none" stroke="#38BDF8" stroke-width="2"/>
    <circle cx="20" cy="10" r="3" fill="#38BDF8"/>
  </g>
  <text x="160" y="215" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="700" fill="#334155">SeeThru 7" Contactless VDP</text>
</svg>
