<!-- Surveillance 1TB HDD -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 240" width="320" height="240">
  <rect width="100%" height="100%" fill="#F8FAFC" rx="12"/>
  <!-- HDD 3.5" Metal Casing -->
  <rect x="75" y="30" width="170" height="155" rx="8" fill="#CBD5E1" stroke="#64748B" stroke-width="2.5"/>
  <rect x="85" y="40" width="150" height="135" rx="4" fill="#334155"/>
  <!-- Top Label Plate -->
  <rect x="95" y="48" width="130" height="75" rx="4" fill="#FFFFFF"/>
  <rect x="95" y="48" width="130" height="18" fill="#5F9EA0"/>
  <text x="102" y="61" fill="#FFFFFF" font-size="9" font-family="sans-serif" font-weight="bold">PRO SURVEILLANCE</text>
  <text x="102" y="85" fill="#1E293B" font-size="16" font-family="sans-serif" font-weight="900">1.0 TB</text>
  <text x="102" y="102" fill="#64748B" font-size="8" font-family="sans-serif">24/7 CCTV DVR/NVR Drive</text>
  <rect x="180" y="70" width="35" height="40" fill="#E2E8F0" rx="2"/>
  <!-- SATA Connection Pins -->
  <rect x="110" y="180" width="50" height="8" fill="#1E293B"/>
  <rect x="170" y="180" width="30" height="8" fill="#1E293B"/>
  <text x="160" y="215" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="700" fill="#334155">1TB Surveillance Storage HDD</text>
</svg>
