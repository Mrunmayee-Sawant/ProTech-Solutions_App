<!-- Godrej Ace Pro 4G Mini PT 3MP -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 240" width="320" height="240">
  <rect width="100%" height="100%" fill="#F8FAFC" rx="12"/>
  <!-- Wall Mount Bracket -->
  <path d="M 120 30 L 160 30 L 160 70 L 140 70 Z" fill="#475569"/>
  <!-- Rotating Gimbal Head -->
  <ellipse cx="160" cy="75" rx="35" ry="12" fill="#E2E8F0" stroke="#94A3B8" stroke-width="2"/>
  <!-- PT Dome Sphere -->
  <circle cx="160" cy="115" r="42" fill="#FFFFFF" stroke="#64748B" stroke-width="2.5"/>
  <!-- Lens Window -->
  <ellipse cx="160" cy="115" rx="26" ry="32" fill="#0F172A"/>
  <!-- Lens -->
  <circle cx="160" cy="115" r="16" fill="#1E293B" stroke="#38BDF8" stroke-width="2"/>
  <circle cx="160" cy="115" r="8" fill="#0284C7"/>
  <circle cx="157" cy="112" r="2.5" fill="#FFFFFF"/>
  <!-- White Floodlights & IR -->
  <circle cx="145" cy="100" r="3" fill="#F8FAFC"/>
  <circle cx="175" cy="100" r="3" fill="#F8FAFC"/>
  <circle cx="145" cy="130" r="2.5" fill="#EF4444"/>
  <circle cx="175" cy="130" r="2.5" fill="#EF4444"/>
  <!-- 4G Antenna -->
  <line x1="125" y1="80" x2="105" y2="40" stroke="#334155" stroke-width="3.5" stroke-linecap="round"/>
  <!-- Rotation arrow hint -->
  <path d="M 195 110 A 40 40 0 0 1 195 130" fill="none" stroke="#5F9EA0" stroke-width="2" stroke-dasharray="3,2"/>
  <text x="160" y="215" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="700" fill="#334155">Ace Pro 4G Mini PT 3MP Pan/Tilt</text>
</svg>
